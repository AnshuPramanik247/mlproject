<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Student Score Predictor</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            display: grid;
            min-width: 320px;
            min-height: 100vh;
            place-items: center;
            margin: 0;
            padding: 24px;
            background:
                radial-gradient(ellipse at 75% 15%, rgb(218 229 255 / 70%), transparent 30rem),
                #f5f7fb;
            color: #17243b;
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        .welcome-card {
            width: min(100%, 620px);
            padding: clamp(30px, 7vw, 58px);
            border: 1px solid #e6eaf2;
            border-radius: 24px;
            background: rgb(255 255 255 / 95%);
            box-shadow: 0 18px 55px rgb(34 51 84 / 8%);
        }

        .brand-mark {
            display: grid;
            width: 42px;
            height: 42px;
            place-items: center;
            border-radius: 14px;
            background: #315ee8;
            color: #fff;
            font-size: 18px;
            font-weight: 800;
        }

        .eyebrow {
            margin: 32px 0 12px;
            color: #315ee8;
            font-size: 12px;
            font-weight: 800;
            letter-spacing: 0.13em;
            text-transform: uppercase;
        }

        h1 {
            margin: 0;
            font-size: clamp(36px, 7vw, 54px);
            letter-spacing: -0.055em;
            line-height: 1.08;
        }

        p {
            margin: 18px 0 27px;
            color: #66738a;
            font-size: 15px;
            line-height: 1.7;
        }

        .start-link {
            display: inline-flex;
            min-height: 48px;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 0 19px;
            border-radius: 10px;
            background: #315ee8;
            color: #fff;
            font-size: 14px;
            font-weight: 750;
            text-decoration: none;
            transition: background-color 150ms ease, transform 150ms ease;
        }

        .start-link:hover {
            transform: translateY(-1px);
            background: #244ed0;
        }

        .start-link:focus-visible {
            outline: 3px solid #99b1ff;
            outline-offset: 3px;
        }
    </style>
</head>
<body>
    <main class="welcome-card">
        <div class="brand-mark" aria-hidden="true">S</div>
        <p class="eyebrow">Learning insights</p>
        <h1>Student Score Predictor</h1>
        <p>
            Explore an estimated math score using student background and reading
            and writing scores. Enter the details to get started.
        </p>
        <a class="start-link" href="{{ url_for('predict_datapoint') }}">
            Open the predictor <span aria-hidden="true">→</span>
        </a>
    </main>
</body>
</html>
