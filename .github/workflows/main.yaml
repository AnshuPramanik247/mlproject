name: workflow

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'

permissions:
  id-token: write
  contents: read

jobs:
  integration:
    name: Continuous Integration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Lint code
        run: echo "Linting repository"

      - name: Run unit tests
        run: echo "Running unit tests"

  build-and-push-ecr-image:
    name: Continuous Delivery
    needs: integration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Utilities
        run: |
          sudo apt-get update
          sudo apt-get install -y jq unzip

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image to Amazon ECR
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY_NAME }}
          IMAGE_TAG: latest
        run: |
          # Sanitize inputs by stripping all whitespace and newlines
          CLEAN_REGISTRY=$(echo "$ECR_REGISTRY" | tr -d '[:space:]')
          CLEAN_REPO=$(echo "$ECR_REPOSITORY" | tr -d '[:space:]')
          echo "ECR Registry: $CLEAN_REGISTRY"
          echo "ECR Repository: $CLEAN_REPO"
          docker build -t "$CLEAN_REGISTRY/$CLEAN_REPO:$IMAGE_TAG" .
          docker push "$CLEAN_REGISTRY/$CLEAN_REPO:$IMAGE_TAG"
          echo "IMAGE_NAME=$CLEAN_REGISTRY/$CLEAN_REPO:$IMAGE_TAG" >> $GITHUB_ENV

  Continuous-Deployment:
    name: Continuous Deployment
    needs: build-and-push-ecr-image
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Pull latest images
        env:
          ECR_REGISTRY: ${{ secrets.AWS_ECR_LOGIN_URI }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY_NAME }}
        run: |
          CLEAN_REGISTRY=$(echo "$ECR_REGISTRY" | tr -d '[:space:]')
          CLEAN_REPO=$(echo "$ECR_REPOSITORY" | tr -d '[:space:]')
          docker pull "$CLEAN_REGISTRY/$CLEAN_REPO:latest"

      - name: Stop and remove container if running
        run: |
          docker ps -q --filter "name=mltest" | grep -q . && docker stop mltest && docker rm -fv mltest || true

      - name: Run Docker Image to serve users
        env:
          ECR_REGISTRY: ${{ secrets.AWS_ECR_LOGIN_URI }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY_NAME }}
        run: |
          CLEAN_REGISTRY=$(echo "$ECR_REGISTRY" | tr -d '[:space:]')
          CLEAN_REPO=$(echo "$ECR_REPOSITORY" | tr -d '[:space:]')
          docker run -d -p 8080:8080 --name=mltest \
            -e 'AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }}' \
            -e 'AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }}' \
            -e 'AWS_REGION=us-east-1' \
            "$CLEAN_REGISTRY/$CLEAN_REPO:latest"

      - name: Clean previous images and containers
        run: |
          docker system prune -f

